# ============================================
# CONFIGURACIÓN GENERAL
# ============================================
spring.application.name=backend-benteveo
server.port=${PORT:8080}

# ============================================
# BASE DE DATOS (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benteveo_db}
spring.datasource.username=${DB_USER:dev_user}
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Usamos 'update' para que cree/actualice las tablas automáticamente según tus Entidades JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SUBIDA DE ARCHIVOS (Multipart)
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ============================================
# CORS
# ============================================
cors.allowed-origins=${FRONTEND_URL:*}

# ============================================
# SEGURIDAD & JWT
# ============================================
jwt.secret=${JWT_SECRET:clave_secreta_super_segura_para_desarrollo_local_123456789_benteveo}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

#============================================
#CLOUDINARY CONFIGURATION
